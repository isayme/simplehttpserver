<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文件上传</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #171a22;
    --surface-2: #1e222c;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8a91a0;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, 0.12);
    --success: #3ecf8e;
    --danger: #ff5c72;
    --radius: 14px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(91, 140, 255, 0.15), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(62, 207, 142, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.5;
  }

  .app {
    width: 100%;
    max-width: 560px;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }

  .header p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }

  .dropzone {
    position: relative;
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }

  .dropzone:hover {
    border-color: var(--accent);
    background: var(--surface-2);
  }

  .dropzone.dragging {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: scale(1.01);
  }

  .dropzone .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-soft);
    border-radius: 50%;
    color: var(--accent);
    transition: transform 0.2s ease;
  }

  .dropzone.dragging .icon {
    transform: translateY(-4px);
  }

  .dropzone .title {
    font-size: 16px;
    font-weight: 550;
  }

  .dropzone .title span {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .dropzone .hint {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
  }

  input[type="file"] {
    display: none;
  }

  .file-list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .file-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .thumb {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    flex-shrink: 0;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    overflow: hidden;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .file-info {
    flex: 1;
    min-width: 0;
  }

  .file-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .progress {
    height: 5px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-bar {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.15s linear;
  }

  .file-item.done .progress-bar {
    background: var(--success);
  }

  .file-item.error {
    border-color: var(--danger);
  }

  .file-item.error .progress-bar {
    background: var(--danger);
  }

  .file-item.error .file-meta {
    color: var(--danger);
  }

  .remove-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    transition: color 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }

  .remove-btn:hover {
    color: var(--danger);
    background: rgba(255, 92, 114, 0.12);
  }

  .actions {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    justify-content: flex-end;
  }

  .actions.hidden {
    display: none;
  }

  .btn {
    font-size: 14px;
    font-weight: 550;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }

  .btn:hover {
    border-color: var(--muted);
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.primary:hover {
    opacity: 0.9;
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 12px;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>文件上传</h1>
      <p>拖拽文件到下方区域，或点击选择文件</p>
    </div>

    <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="上传文件区域">
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
      </div>
      <div class="title">拖拽文件到这里，或 <span>浏览文件</span></div>
      <div class="hint">支持多个文件，单个文件最大 50 MB</div>
      <input type="file" id="fileInput" multiple />
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="actions hidden" id="actions">
      <button class="btn" id="clearBtn">清空列表</button>
      <button class="btn primary" id="uploadBtn">开始上传</button>
    </div>
  </div>

  <script>
    (function () {
      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("fileInput");
      const fileList = document.getElementById("fileList");
      const actions = document.getElementById("actions");
      const clearBtn = document.getElementById("clearBtn");
      const uploadBtn = document.getElementById("uploadBtn");

      const MAX_SIZE = 50 * 1024 * 1024; // 50 MB

      // 上传接口地址（mock）。后端就绪后替换为真实地址即可。
      const UPLOAD_URL = "/api/upload";
      // 后端接收文件字段名，按需修改。
      const UPLOAD_FIELD = "files";

      let files = []; // { id, file, status: 'ready'|'uploading'|'done'|'error', progress, xhr }
      let uid = 0;

      function formatSize(bytes) {
        if (bytes === 0) return "0 B";
        const units = ["B", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + " " + units[i];
      }

      function extLabel(name) {
        const parts = name.split(".");
        return parts.length > 1 ? parts.pop().slice(0, 4) : "?";
      }

      function addFiles(fileArr) {
        for (const file of fileArr) {
          if (file.size > MAX_SIZE) {
            alert('文件 "' + file.name + '" 超过 50 MB，已跳过。');
            continue;
          }
          files.push({ id: ++uid, file, status: "ready", progress: 0 });
        }
        render();
      }

      function removeFile(id) {
        const target = files.find((f) => f.id === id);
        if (target && target.xhr) target.xhr.abort();
        files = files.filter((f) => f.id !== id);
        syncButtons();
        render();
      }

      function render() {
        fileList.innerHTML = "";

        if (files.length === 0) {
          actions.classList.add("hidden");
          return;
        }
        actions.classList.remove("hidden");

        files.forEach((item) => {
          const el = document.createElement("div");
          el.className =
            "file-item" +
            (item.status === "done" ? " done" : "") +
            (item.status === "error" ? " error" : "");
          if (item.status === "error") {
            el.style.cursor = "pointer";
            el.addEventListener("click", (e) => {
              if (e.target.closest(".remove-btn")) return;
              uploadOne(item);
            });
          }

          const thumb = document.createElement("div");
          thumb.className = "thumb";
          if (item.file.type.startsWith("image/")) {
            const img = document.createElement("img");
            img.src = URL.createObjectURL(item.file);
            img.alt = item.file.name;
            img.onload = () => URL.revokeObjectURL(img.src);
            thumb.appendChild(img);
          } else {
            thumb.textContent = extLabel(item.file.name);
          }

          const info = document.createElement("div");
          info.className = "file-info";

          const name = document.createElement("div");
          name.className = "file-name";
          name.textContent = item.file.name;

          const meta = document.createElement("div");
          meta.className = "file-meta";
          if (item.status === "uploading") {
            meta.textContent = "上传中… " + item.progress + "%";
          } else if (item.status === "done") {
            meta.textContent = "上传完成 · " + formatSize(item.file.size);
          } else if (item.status === "error") {
            meta.textContent = "上传失败，点击重试";
          } else {
            meta.textContent = formatSize(item.file.size);
          }

          info.appendChild(name);
          info.appendChild(meta);

          if (item.status !== "ready") {
            const progress = document.createElement("div");
            progress.className = "progress";
            const bar = document.createElement("div");
            bar.className = "progress-bar";
            bar.style.width = item.progress + "%";
            progress.appendChild(bar);
            info.appendChild(progress);
          }

          const btn = document.createElement("button");
          btn.className = "remove-btn";
          btn.setAttribute("aria-label", "移除文件");
          btn.innerHTML =
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
          btn.addEventListener("click", () => removeFile(item.id));

          el.appendChild(thumb);
          el.appendChild(info);
          if (item.status !== "uploading") el.appendChild(btn);

          fileList.appendChild(el);
        });
      }

      // 刷新按钮的可用状态：只要还有文件在上传就禁用。
      function syncButtons() {
        const uploading = files.some((f) => f.status === "uploading");
        uploadBtn.disabled = uploading;
        clearBtn.disabled = uploading;
        const hasPending = files.some(
          (f) => f.status === "ready" || f.status === "error"
        );
        uploadBtn.textContent = uploading ? "上传中…" : "开始上传";
      }

      // 通过 XMLHttpRequest 上传单个文件，可获取真实上传进度。
      function uploadOne(item) {
        if (item.status === "uploading" || item.status === "done") return;

        const formData = new FormData();
        formData.append(UPLOAD_FIELD, item.file, item.file.name);

        const xhr = new XMLHttpRequest();
        item.xhr = xhr;
        item.status = "uploading";
        item.progress = 0;
        syncButtons();
        render();

        xhr.upload.addEventListener("progress", (e) => {
          if (e.lengthComputable) {
            item.progress = Math.round((e.loaded / e.total) * 100);
            render();
          }
        });

        xhr.addEventListener("load", () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            item.progress = 100;
            item.status = "done";
          } else {
            item.status = "error";
          }
          item.xhr = null;
          syncButtons();
          render();
        });

        xhr.addEventListener("error", () => {
          item.status = "error";
          item.xhr = null;
          syncButtons();
          render();
        });

        xhr.addEventListener("abort", () => {
          item.status = "error";
          item.xhr = null;
          syncButtons();
          render();
        });

        xhr.open("POST", UPLOAD_URL);
        // 如需鉴权，可在此设置请求头，例如：
        // xhr.setRequestHeader("Authorization", "Bearer <token>");
        xhr.send(formData);
      }

      function startUpload() {
        const pending = files.filter(
          (f) => f.status === "ready" || f.status === "error"
        );
        pending.forEach(uploadOne);
      }

      // 事件绑定
      dropzone.addEventListener("click", () => fileInput.click());
      dropzone.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fileInput.click();
        }
      });

      fileInput.addEventListener("change", (e) => {
        addFiles(Array.from(e.target.files));
        fileInput.value = "";
      });

      ["dragenter", "dragover"].forEach((evt) => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropzone.classList.add("dragging");
        });
      });

      ["dragleave", "drop"].forEach((evt) => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          if (evt === "dragleave" && dropzone.contains(e.relatedTarget)) return;
          dropzone.classList.remove("dragging");
        });
      });

      dropzone.addEventListener("drop", (e) => {
        const dropped = e.dataTransfer.files;
        if (dropped && dropped.length) addFiles(Array.from(dropped));
      });

      clearBtn.addEventListener("click", () => {
        files.forEach((f) => f.xhr && f.xhr.abort());
        files = [];
        syncButtons();
        render();
      });

      uploadBtn.addEventListener("click", startUpload);

      // 防止浏览器默认打开拖入的文件
      window.addEventListener("dragover", (e) => e.preventDefault());
      window.addEventListener("drop", (e) => e.preventDefault());
    })();
  </script>
</body>
</html>
